insmod all_video
insmode vbe
insmode vga
insmod gfxterm
insmod font

set gfxmode=1280x1024x32;1024x768x32;800x600x32;640x480x32
set gfxpayload=keep

terminal_output gfxterm
set timeout=5
set default=0

menuentry "CourseOS(1280x1024)"{
	insmod all_video
	set gfxpayload=1280x1024x32, 1280x1024
	multiboot2 /boot/myos.kernel
	boot
}

menuentry "CourseOS(1024x768)"{
	insmod all_video
	set gfxpayload=1024x768x32, 1024x768
	multiboot2 /boot/myos.kernel
	boot
}

menuentry "CourseOS(800x600)"{
	insmod all_video
	set gfxpayload=800x600x32, 800x600
	multiboot2 /boot/myos.kernel
	boot
}

menuentry "CourseOS(640x480)"{
	insmod all_video
	set gfxpayload=640x480x32, 640x480
	multiboot2 /boot/myos.kernel
	boot
}