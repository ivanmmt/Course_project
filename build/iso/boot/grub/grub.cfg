
insmod all_video
insmod vbe
insmod vga
insmod gfxterm
insmod font

set gfxmode=1024x768x32;800x600x32;640x480x32
set gfxpayload=keep

terminal_output gfxterm

set timeout=2
set default=0

menuentry "MyOS" {
    insmod all_video
    set gfxpayload=1024x768x32,1024x768
    multiboot2 /boot/myos.kernel
    boot
}

menuentry "MyOS(800x600 fallback)" {
    insmod all_video
    set gfxpayload=800x600x32,800x600
    multiboot2 /boot/myos.kernel
    boot
}

menuentry "MyOS(640x480 fallback)" {
    insmod all_video
    set gfxpayload=640x480x32,640x480
    multiboot2 /boot/myos.kernel
    boot
}
